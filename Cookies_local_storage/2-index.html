<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Web Page 3</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    function setCookies() {
      const firstname = document.getElementById("firstName").value;
      const email = document.getElementById("email").value;
      const deadline = new Date();
      deadline.setDate(deadline.getDate() + 10);
      const deadlineDate = `expires=${deadline.toUTCString()}`;
      document.cookie = `firstname=${(firstname)}; ${deadlineDate}; path=/`;
      document.cookie = `email=${(email)}; ${deadlineDate}; path=/`;
    }
    function showCookies() {
      const sentence = document.createElement("p");
      const node = document.createTextNode(`Email: ${getCookie("email")} - Firstname: ${getCookie("firstname")}`);
      sentence.append(node);
      document.body.append(sentence);
    }
    function getCookie(name) {
      let cname = `${name}=`;
      let decodedCookie = decodeURIComponent(document.cookie);
      let ca = decodedCookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') {
          c = c.substring(1);
        }
        if (c.indexOf(cname) == 0) {
          return c.substring(cname.length, c.length);
        }
      }
      return '';
    }
  </script>
</head>
<body>

  <header>
    <h1>Login to the Website</h1>
  </header>

  <main>
    <div>
      <input id="firstName" type="text" name="firstname" placeholder="Firstname">
      <input id="email" type="text" name="email" placeholder="Email">
      <button type="button" onclick="setCookies()">Log me in</button>
    </div>
    <div>
      <h1>Cookies</h1>
      <button type="button" onclick="showCookies()">Show the cookies</button>
    </div>
  </main>
</body>
</html>
