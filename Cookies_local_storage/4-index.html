<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Web Page 5</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    function setCookies() {
      const firstname = document.getElementById("firstName").value;
      const email = document.getElementById("email").value;
      Cookies.set('firstname', firstname, { expires: 10 });
      Cookies.set('email', email, { expires: 10 });
      showWelcomeMessageOrForm();
    }
    function showCookies() {
      const sentence = document.createElement("p");
      const node = document.createTextNode(`Email: ${Cookies.get("email")} - Firstname: ${Cookies.get("firstname")}`);
      sentence.append(node);
      document.body.append(sentence);
    }
    function showForm() {
      document.getElementById('welcome').style.display="none";
      document.getElementById('flogin').style.display="block";
      document.querySelector("header").style.display="block";
    }
    function hideForm() {
      document.getElementById('flogin').style.display="none";
      document.querySelector("header").style.display="none";
      document.getElementById('welcome').style.display='block';
    }
    function deleteCookiesAndShowForm() {
      Cookies.remove('firstname');
      Cookies.remove('email');
      showForm();
    }
    function showWelcomeMessageOrForm() {
      if (Cookies.get("firstname") === '' || Cookies.get('firstname') === undefined) {
        showForm();
      } else {
        hideForm();
        const h1Element = document.createElement('h1');
        h1Element.id = 'welcomeMessage';
        h1Element.innerHTML = `welcome ${Cookies.get("firstname")} <span id="logoutLink">(logout)</span>`;
        document.getElementById("welcome").appendChild(h1Element);
        document.getElementById("logoutLink").addEventListener("click", function () {
          deleteCookiesAndShowForm();
          h1Element.remove();
        });
      }
    }

    window.onload = showWelcomeMessageOrForm;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
</head>
<body>

  <header>
    <h1>Login to the Website</h1>
  </header>

  <main>
    <div id="flogin">
      <form>
        <input id="firstName" type="text" name="firstname" placeholder="Firstname">
        <input id="email" type="text" name="email" placeholder="Email">
        <button type="button" onclick="setCookies()">Log me in</button>
      </form>
    </div>
    <div id="welcome">
    </div>
  </main>
</body>
</html>
