<!DOCTYPE html>
<html lang="en" dir="ltr">

    <head>

        <meta charset="utf-8" />
        <title>Task 4</title>
        <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script>
        <script type="text/javascript">
          $(document).ready(function() {
            function createFamilyTree() {
              $('body').append('<table></table>');
              $('table').append('<thead></thead>');
              $('thead').append('<tr></tr>');
              $('tr').append('<th></th>', '<th></th>');
              $('th').eq(0).text('Firstname');
              $('th').eq(1).text('Lastname');
              $('table').append('<tbody></tbody>');
              $('tbody').append('<tr></tr>', '<tr></tr>');
              $('tbody tr').eq(0).append('<td></td>', '<td></td>');
              $('tbody tr').eq(0).children('td').eq(0).text('Guillaume');
              $('tbody tr').eq(0).children('td').eq(1).text('Salva');
              $('tbody tr').eq(1).append('<td></td>', '<td></td>');
              $('tbody tr').eq(1).children('td').eq(0).text('Paulette');
              $('tbody tr').eq(1).children('td').eq(1).text('Salva');
            }
            createFamilyTree();
            function replaceFamilyTree() {
              $('tbody').html('<tr><td>Gerard</td><td>Bonissa</td></tr>');
            }
            replaceFamilyTree();
          });
        </script>
    </head>
